---
title: "SRE & Systems CLI Lab"
linkTitle: "Lab"
description: "Incremental Learn & Test CLI lab for Linux, Networking, Containers, Kubernetes, Cilium, and Go."
---

<div id="sre-cli-lab-root" class="container my-5" style="max-width: 780px; position: relative; z-index: 2;">

  <!-- Clean Top Control Bar -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 px-1">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <select id="lab-topic-select" class="form-select form-select-sm lab-select" aria-label="Select topic">
        <option value="all">All Topics</option>
      </select>

      <select id="lab-level-select" class="form-select form-select-sm lab-select" aria-label="Select difficulty level">
        <option value="auto">Auto Incremental (L1 → L4)</option>
        <option value="1">Level 1 · Foundation</option>
        <option value="2">Level 2 · Filtering &amp; Flags</option>
        <option value="3">Level 3 · Deep Diagnostics</option>
        <option value="4">Level 4 · Incident Chains</option>
      </select>

      <select id="lab-mode-select" class="form-select form-select-sm lab-select" aria-label="Select learning mode">
        <option value="adaptive">Learn → Test (Adaptive)</option>
        <option value="test">Test Only (No Spoilers)</option>
        <option value="learn">Learn Only (Guided)</option>
        <option value="sprint">⚡ 10-Q Mock Sprint</option>
      </select>
    </div>

    <div class="d-flex align-items-center gap-3 small text-secondary font-monospace">
      <span title="Current unlocked incremental level">Level: <strong class="text-body" id="lab-stat-level">L1</strong></span>
      <span title="Commands passed in blind Test mode">Mastered: <strong class="text-body" id="lab-stat-solved">0/0</strong></span>
      <span title="Current correct streak">Streak: <strong class="text-body" id="lab-stat-streak">0 🔥</strong></span>
    </div>
  </div>

  <!-- Single Card Mount -->
  <div id="lab-question-mount"></div>

</div>

<script src="/js/lab-data.js" defer></script>
<script src="/js/lab-app.js" defer></script>
